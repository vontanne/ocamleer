title: OCamleer
description: "An Armenian-language blog about OCaml, covering core concepts, history, and interesting aspects of the language"
url: "https://vontanne.github.io"
baseurl: "/ocamleer"
repository: "vontanne/ocamleer"
locale: "hy-AM"
timezone: "Asia/Yerevan"
og_image_alt: "OCamleer"

author:
  name: "Hovhannes Hovhannisyan"

twitter:
  username: "vontanne"

theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "dark"

markdown: kramdown
kramdown:
  input: GFM

permalink: /posts/:title/

search: true
search_full_content: true

enable_copy_code_button: true

tag_archive:
  type: liquid
  path: /tags/

footer:
  since: "2026"
  links: # icon: an SVG file name in _includes/icons/
    - label: "GitHub"
      icon: "brand-github"
      url: "https://github.com/vontanne"
    - label: "X"
      icon: "brand-x"
      url: "https://x.com/vontanne"

atom_feed:
  hide: true

copyright_url: "https://vontanne.github.io/ocamleer/"

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-sitemap

readme_index:
  remove_originals: true

relative_links:
  enabled: true
  collections: true

include:
  - _pages

exclude:
  - LICENSE
  - vendor/

sass:
  style: compressed
  quiet_deps: true
  silence_deprecations: ["import"]

defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: false
      header:
        og_image: /assets/images/og-image.png # share preview, 1200×630
  - scope:
      path: ""
      type: posts
    values:
      share: true
      related: true
      read_time: true
      show_date: true
      classes: publication
  - scope:
      path: "README.md"
    values:
      classes: home
